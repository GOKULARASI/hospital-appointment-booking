{% extends "base.html" %}

{% block title %}Departments - Hospital Booking{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2><i class="bi bi-building"></i> Departments</h2>
        <hr>
    </div>
</div>

<div class="row">
    {% if departments %}
        {% for department in departments %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ department }}</h5>
                    <a href="{{ url_for('patient.doctors', department=department) }}" class="btn btn-primary">View Doctors</a>
                </div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="col-md-12">
            <div class="alert alert-info">No departments available at the moment.</div>
        </div>
    {% endif %}
</div>
{% endblock %}
