{% extends "base.html" %}

{% block title %}Edit Doctor - Hospital Booking{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2><i class="bi bi-pencil-square"></i> Edit Doctor</h2>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Doctor Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ doctor.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ doctor.department }}" list="departments" required>
                        <datalist id="departments">
                            {% for dept in departments %}
                            <option value="{{ dept }}">
                            {% endfor %}
                        </datalist>
                    </div>
                    <div class="mb-3">
                        <label for="specialization" class="form-label">Specialization</label>
                        <input type="text" class="form-control" id="specialization" name="specialization" value="{{ doctor.specialization }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Doctor</button>
                    <a href="{{ url_for('admin.doctors') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
