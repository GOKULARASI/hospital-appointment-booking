{% extends "base.html" %}

{% block title %}Add Doctor - Hospital Booking{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2><i class="bi bi-person-plus"></i> Add Doctor</h2>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Doctor Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" class="form-control" id="department" name="department" list="departments" required>
                        <datalist id="departments">
                            {% for dept in departments %}
                            <option value="{{ dept }}">
                            {% endfor %}
                        </datalist>
                    </div>
                    <div class="mb-3">
                        <label for="specialization" class="form-label">Specialization</label>
                        <input type="text" class="form-control" id="specialization" name="specialization" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Doctor</button>
                    <a href="{{ url_for('admin.doctors') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
